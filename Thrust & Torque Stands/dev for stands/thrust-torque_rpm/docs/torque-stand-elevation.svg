<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="700" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#141413" font-weight="bold">Torque Stand - side elevation</text>
<text x="30" y="62" font-size="11.5" fill="#6b6a66">Standalone rig. Nacelle on a cradle that pivots on two bearings about a vertical axis. Thrust is unmeasured but present; the shaft collar is the only thing stopping lift.</text>
<line x1="180" y1="110" x2="580" y2="110" stroke="#141413" stroke-width="3"/>
<line x1="380" y1="110" x2="380" y2="124" stroke="#141413" stroke-width="3"/>
<rect x="332" y="124" width="96" height="56" rx="7" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="380" y="157" font-size="12" fill="#712B13" text-anchor="middle" font-weight="bold">NACELLE</text>
<rect x="314" y="182" width="132" height="16" rx="4" fill="#FAF6ED" stroke="#B8860B" stroke-width="1.6"/>
<rect x="336" y="212" width="88" height="138" rx="7" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
<rect x="372" y="198" width="16" height="146" rx="3" fill="#ffffff" stroke="#141413" stroke-width="1.2"/>
<rect x="352" y="218" width="56" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
<rect x="352" y="316" width="56" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
<rect x="368" y="332" width="24" height="9" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
<line x1="346" y1="232" x2="346" y2="316" stroke="#141413" stroke-width="0.9" marker-end="url(#arr)"/>
<line x1="346" y1="316" x2="346" y2="232" stroke="#141413" stroke-width="0.9" marker-end="url(#arr)"/>
<rect x="354" y="350" width="52" height="150" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
<rect x="260" y="500" width="240" height="20" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
<line x1="230" y1="526" x2="530" y2="526" stroke="#6b6a66" stroke-width="3"/>
<text x="380" y="545" font-size="10.5" fill="#6b6a66" text-anchor="middle">bench, bolted</text>
<line x1="580" y1="110" x2="614" y2="108" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="580" cy="110" r="2.2" fill="#6b6a66"/>
<text x="620" y="112" font-size="11" fill="#141413" text-anchor="start">Rotor disc, R = 457 mm</text>
<line x1="428" y1="152" x2="614" y2="150" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="428" cy="152" r="2.2" fill="#6b6a66"/>
<text x="620" y="154" font-size="11" fill="#141413" text-anchor="start">Nacelle bolts to the cradle. Loom goes down the tube on the axis.</text>
<line x1="446" y1="190" x2="614" y2="190" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="446" cy="190" r="2.2" fill="#6b6a66"/>
<text x="620" y="194" font-size="11" fill="#141413" text-anchor="start">Cradle disc, 150 mm dia, 14 mm thick. Arm is integral, see plan.</text>
<line x1="424" y1="225" x2="614" y2="225" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="424" cy="225" r="2.2" fill="#6b6a66"/>
<text x="620" y="229" font-size="11" fill="#141413" text-anchor="start">Upper bearing 6004-ZZ (20 x 42 x 12). Shielded, not sealed.</text>
<line x1="424" y1="274" x2="614" y2="274" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="424" cy="274" r="2.2" fill="#6b6a66"/>
<text x="620" y="278" font-size="11" fill="#141413" text-anchor="start">60 mm clear between bearings. Takes the tipping moment.</text>
<line x1="424" y1="323" x2="614" y2="323" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="424" cy="323" r="2.2" fill="#6b6a66"/>
<text x="620" y="327" font-size="11" fill="#141413" text-anchor="start">Lower bearing 6004-ZZ, seats up against the tower shoulder.</text>
<line x1="424" y1="337" x2="614" y2="360" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="424" cy="337" r="2.2" fill="#6b6a66"/>
<text x="620" y="364" font-size="11" fill="#141413" text-anchor="start">Shaft collar under the lower inner race. Axial stop: thrust pulls UP.</text>
<line x1="406" y1="425" x2="614" y2="425" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="406" cy="425" r="2.2" fill="#6b6a66"/>
<text x="620" y="429" font-size="11" fill="#141413" text-anchor="start">Column, sets rotor height. Hollow, so the loom exits at the base.</text>
<line x1="500" y1="510" x2="614" y2="500" stroke="#6b6a66" stroke-width="0.8" stroke-dasharray="4 3"/>
<circle cx="500" cy="510" r="2.2" fill="#6b6a66"/>
<text x="620" y="504" font-size="11" fill="#141413" text-anchor="start">Base plate 400 x 340 x 10 min, aluminium or ply. Bolt it down.</text>
<text x="30" y="590" font-size="10.5" fill="#6b6a66" text-anchor="start">Nothing else may touch the cradle: no zip ties, no tach wire, no throttle lead on the bench. Everything crossing the joint goes down the tube.</text>
<text x="30" y="606" font-size="10.5" fill="#6b6a66" text-anchor="start">The joint moves a few thousandths of a degree at full scale. Seal drag on 2RS bearings reads as hysteresis; use ZZ. Rotor vibration dithers the</text>
<text x="30" y="622" font-size="10.5" fill="#6b6a66" text-anchor="start">joint out of stiction in service, so the running measurement behaves better than pushing the arm by hand. Do not judge the rig statically.</text>
<text x="30" y="638" font-size="10.5" fill="#6b6a66" text-anchor="start">Load path for thrust: collar -&gt; lower inner race -&gt; balls -&gt; outer race -&gt; tower shoulder. 33 N through a 6004 is nothing; the collar must be tight.</text>
</svg>
