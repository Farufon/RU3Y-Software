<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" viewBox="0 0 980 760" font-family="Helvetica, Arial, sans-serif">
<rect width="980" height="760" fill="#ffffff"/>
<text x="30" y="40" font-size="20" fill="#141413" text-anchor="start" font-weight="bold">Thrust Stand Wiring - Adafruit HX711 24-bit ADC (product 5974)</text>
<text x="30" y="62" font-size="11.5" fill="#6b6a66" text-anchor="start">Four wires to the Arduino. VIO is an OUTPUT - leave it unconnected. RATE is a slide switch, set to L.</text>
<rect x="30" y="100" width="200" height="180" rx="7" fill="#FAF6ED" stroke="#B8860B" stroke-width="1.6"/>
<text x="130.0" y="126" font-size="13.5" fill="#854F0B" text-anchor="middle" font-weight="bold">S-BEAM LOAD CELL</text>
<text x="130.0" y="144" font-size="10.5" fill="#854F0B" text-anchor="middle">20 kg, bidirectional</text>
<circle cx="52" cy="166" r="4.5" fill="#C0392B"/>
<text x="66" y="170" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">RED</text>
<text x="130" y="170" font-size="10.5" fill="#6b6a66" text-anchor="start">E+ excitation</text>
<circle cx="52" cy="188" r="4.5" fill="#141413"/>
<text x="66" y="192" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">BLACK</text>
<text x="130" y="192" font-size="10.5" fill="#6b6a66" text-anchor="start">E- excitation</text>
<circle cx="52" cy="210" r="4.5" fill="#1E8449"/>
<text x="66" y="214" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">GREEN</text>
<text x="130" y="214" font-size="10.5" fill="#6b6a66" text-anchor="start">A+ signal</text>
<circle cx="52" cy="232" r="4.5" fill="#8A8A85"/>
<text x="66" y="236" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">WHITE</text>
<text x="130" y="236" font-size="10.5" fill="#6b6a66" text-anchor="start">A- signal</text>
<circle cx="52" cy="254" r="4.5" fill="#6b6a66"/>
<text x="66" y="258" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">SHIELD</text>
<text x="130" y="258" font-size="10.5" fill="#6b6a66" text-anchor="start">drain</text>
<rect x="390" y="100" width="230" height="300" rx="7" fill="#F4F3EE" stroke="#141413" stroke-width="1.6"/>
<text x="505.0" y="126" font-size="13.5" fill="#141413" text-anchor="middle" font-weight="bold">ADAFRUIT HX711</text>
<text x="505.0" y="143" font-size="10.5" fill="#6b6a66" text-anchor="middle">24-bit bridge ADC</text>
<rect x="402" y="158" width="206" height="118" rx="4" fill="#ffffff" stroke="#6b6a66" stroke-width="1" stroke-dasharray="3 3"/>
<text x="505.0" y="174" font-size="9.5" fill="#6b6a66" text-anchor="middle">screw terminal block (analogue)</text>
<circle cx="416" cy="190" r="3.6" fill="#141413"/>
<text x="428" y="194" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">E+</text>
<circle cx="416" cy="210" r="3.6" fill="#141413"/>
<text x="428" y="214" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">E-</text>
<circle cx="416" cy="230" r="3.6" fill="#141413"/>
<text x="428" y="234" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">A+</text>
<circle cx="416" cy="250" r="3.6" fill="#141413"/>
<text x="428" y="254" font-size="11.5" fill="#141413" text-anchor="start" font-weight="bold">A-</text>
<text x="428" y="276" font-size="9.5" fill="#6b6a66" text-anchor="start">B+  B-   (2nd channel, unused)</text>
<rect x="402" y="296" width="206" height="92" rx="4" fill="#ffffff" stroke="#6b6a66" stroke-width="1" stroke-dasharray="3 3"/>
<text x="505.0" y="312" font-size="9.5" fill="#6b6a66" text-anchor="middle">header (power + digital)</text>
<circle cx="594" cy="326" r="4.2" fill="#1F6FEB"/>
<text x="582" y="330" font-size="11.5" fill="#141413" text-anchor="end" font-weight="bold">VIN</text>
<text x="406" y="330" font-size="9" fill="#6b6a66" text-anchor="start">5V in</text>
<circle cx="594" cy="345" r="4.2" fill="#C2410C"/>
<text x="582" y="349" font-size="11.5" fill="#141413" text-anchor="end" font-weight="bold">VIO</text>
<text x="406" y="349" font-size="9" fill="#C2410C" text-anchor="start">OUTPUT - do not connect</text>
<circle cx="594" cy="364" r="4.2" fill="#141413"/>
<text x="582" y="368" font-size="11.5" fill="#141413" text-anchor="end" font-weight="bold">GND</text>
<circle cx="594" cy="383" r="4.2" fill="#7C3AED"/>
<text x="582" y="387" font-size="11.5" fill="#141413" text-anchor="end" font-weight="bold">SCK</text>
<circle cx="594" cy="402" r="4.2" fill="#1E8449"/>
<text x="582" y="406" font-size="11.5" fill="#141413" text-anchor="end" font-weight="bold">DAT</text>
<rect x="404" y="378" width="96" height="16" rx="3" fill="#ffffff" stroke="#6b6a66"/>
<text x="410" y="390" font-size="9.5" fill="#141413" text-anchor="start" font-weight="bold">RATE switch: L</text>
<rect x="760" y="150" width="190" height="250" rx="7" fill="#FAF6ED" stroke="#1F6FEB" stroke-width="1.6"/>
<text x="855.0" y="176" font-size="13" fill="#1A4F9C" text-anchor="middle" font-weight="bold">ELEGOO NANO V3.0</text>
<text x="855.0" y="193" font-size="10" fill="#6b6a66" text-anchor="middle">powered from laptop USB</text>
<circle cx="782" cy="224" r="4.2" fill="#1F6FEB"/>
<text x="798" y="228" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">5V</text>
<circle cx="782" cy="250" r="4.2" fill="#141413"/>
<text x="798" y="254" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">GND</text>
<circle cx="782" cy="276" r="4.2" fill="#1E8449"/>
<text x="798" y="280" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">D2</text>
<circle cx="782" cy="302" r="4.2" fill="#7C3AED"/>
<text x="798" y="306" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">D3</text>
<text x="782" y="350" font-size="10" fill="#6b6a66" text-anchor="start">USB to laptop</text>
<rect x="780" y="358" width="60" height="20" rx="3" fill="#ffffff" stroke="#6b6a66"/>
<path d="M 222 166 L 376 166 L 376 190" fill="none" stroke="#C0392B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="376" y1="190" x2="412" y2="190" stroke="#C0392B" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 222 188 L 376 188 L 376 210" fill="none" stroke="#141413" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="376" y1="210" x2="412" y2="210" stroke="#141413" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 222 210 L 376 210 L 376 230" fill="none" stroke="#1E8449" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="376" y1="230" x2="412" y2="230" stroke="#1E8449" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 222 232 L 376 232 L 376 250" fill="none" stroke="#8A8A85" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="376" y1="250" x2="412" y2="250" stroke="#8A8A85" stroke-width="2.8" stroke-linecap="round"/>
<path d="M 222 254 L 360 254 L 360 364" fill="none" stroke="#6b6a66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<line x1="360" y1="364" x2="402" y2="364" stroke="#6b6a66" stroke-width="2.4" stroke-linecap="round"/>
<text x="246" y="246" font-size="9.5" fill="#6b6a66" text-anchor="start">shield to GND</text>
<path d="M 600 326 L 660 326 L 660 224 L 778 224" fill="none" stroke="#1F6FEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 600 364 L 682 364 L 682 250 L 778 250" fill="none" stroke="#141413" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 600 402 L 704 402 L 704 276 L 778 276" fill="none" stroke="#1E8449" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 600 383 L 726 383 L 726 302 L 778 302" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="600" y1="345" x2="628" y2="345" stroke="#C2410C" stroke-width="2.4" stroke-dasharray="4 3"/>
<circle cx="638" cy="345" r="7" fill="none" stroke="#C2410C" stroke-width="2"/>
<line x1="633" y1="340" x2="643" y2="350" stroke="#C2410C" stroke-width="2"/>
<rect x="30" y="440" width="920" height="290" rx="7" fill="#FAF6ED" stroke="#6b6a66" stroke-width="1"/>
<text x="50" y="466" font-size="12.5" fill="#141413" text-anchor="start" font-weight="bold">NOTES</text>
<circle cx="56" cy="486" r="2.6" fill="#6b6a66"/>
<text x="68" y="490" font-size="11" fill="#141413" text-anchor="start">VIO is the on-chip regulator OUTPUT for the digital supply. It is not an input. Leave it unconnected.</text>
<circle cx="56" cy="509" r="2.6" fill="#6b6a66"/>
<text x="68" y="513" font-size="11" fill="#141413" text-anchor="start">RATE is a slide switch on this board, not a pin. Set it to L for 10 SPS, which is what the supplied sketch expects.</text>
<circle cx="56" cy="532" r="2.6" fill="#6b6a66"/>
<text x="68" y="536" font-size="11" fill="#141413" text-anchor="start">The 6-pin terminal block carries E+, E-, A+, A- and the unused second channel B+, B-. Use channel A.</text>
<circle cx="56" cy="555" r="2.6" fill="#6b6a66"/>
<text x="68" y="559" font-size="11" fill="#141413" text-anchor="start">Four wires total to the Arduino: VIN to 5V, GND to GND, DAT to D2, SCK to D3.</text>
<circle cx="56" cy="578" r="2.6" fill="#6b6a66"/>
<text x="68" y="582" font-size="11" fill="#141413" text-anchor="start">DAT is the same signal other boards silkscreen as DT or DOUT. The sketch's PIN_DOUT refers to it.</text>
<circle cx="56" cy="601" r="2.6" fill="#6b6a66"/>
<text x="68" y="605" font-size="11" fill="#141413" text-anchor="start">Shield or drain wire lands on GND at the HX711 end only. Never ground it at both ends.</text>
</svg>