<text x="594" y="184" font-size="12" fill="#141413" text-anchor="end" font-weight="bold">VIN</text>
<text x="356" y="214" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">E-</text>
<text x="594" y="214" font-size="12" fill="#141413" text-anchor="end" font-weight="bold">GND</text>
<text x="356" y="244" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">A+</text>
<text x="594" y="244" font-size="12" fill="#141413" text-anchor="end" font-weight="bold">DAT</text>
<text x="356" y="274" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">A-</text>
