<line x1="145.0" y1="370" x2="730" y2="370" stroke="#6b6a66" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="730" y1="370" x2="730" y2="313" stroke="#6b6a66" stroke-width="1.2" marker-end="url(#arr)" stroke-dasharray="5 4"/>
<text x="470" y="364" font-size="10.5" fill="#6b6a66" text-anchor="middle">cable shield: to Nano GND at this end only, never at the cell</text>
<text x="30" y="410" font-size="10.5" fill="#6b6a66" text-anchor="start">Verify the colours with a meter before trusting them. Measure all six pairs: the two highest readings are the diagonals,</text>
<text x="30" y="426" font-size="10.5" fill="#6b6a66" text-anchor="start">and of those two the excitation pair (E+/E-) reads higher than the signal pair. Adjacent pairs read about three quarters of that.</text>
<text x="30" y="442" font-size="10.5" fill="#6b6a66" text-anchor="start"></text>
<text x="30" y="458" font-size="10.5" fill="#6b6a66" text-anchor="start">Same library as the thrust stand (Bogdan Necula HX711), same IDE 1.8.19 recipe (doc 13). Reading line: n,ms,Nm,N,raw.</text>
<text x="30" y="474" font-size="10.5" fill="#6b6a66" text-anchor="start">Calibrate with c &lt;N.m&gt; against a known horizontal force at a caliper-measured radius. See docs/14-torque-stand.md.</text>
</svg>
