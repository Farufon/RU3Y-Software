<text x="30" y="40" font-size="20" fill="#141413" font-weight="bold">Torque Stand Wiring - second Nano, second HX711</text>
<text x="30" y="62" font-size="11.5" fill="#6b6a66">Separate board on its own USB port. Identical pinout to the thrust stand. VIO unconnected, RATE on L, shield to Nano GND at the Nano end only.</text>
