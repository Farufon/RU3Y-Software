<text x="820.0" y="144" font-size="10.5" fill="#3C3489" text-anchor="middle">ATmega328P, own USB port</text>
<text x="706" y="184" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">5V</text>
<text x="706" y="214" font-size="12" fill="#141413" text-anchor="start" font-weight="bold">GND</text>
